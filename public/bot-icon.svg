<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowYellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Icon Frame (Rounded Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Cyberpunk Grid Lines -->
  <g opacity="0.15" stroke="#a855f7" stroke-width="2">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />

    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Speed Trail Particles / Dash Effect -->
  <g opacity="0.7">
    <rect x="80" y="240" width="40" height="12" rx="6" fill="#06b6d4" filter="url(#glowCyan)" />
    <rect x="50" y="270" width="70" height="14" rx="7" fill="#ec4899" filter="url(#glowPink)" />
    <rect x="100" y="300" width="50" height="10" rx="5" fill="#eab308" filter="url(#glowYellow)" />
  </g>

  <!-- Neon Platform & Spikes at the bottom -->
  <path d="M 60 410 L 452 410" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" filter="url(#glowCyan)"/>
  <!-- Spikes -->
  <polygon points="120,410 135,375 150,410" fill="#ef4444" stroke="#f87171" stroke-width="2" filter="url(#glowPink)"/>
  <polygon points="150,410 165,375 180,410" fill="#ef4444" stroke="#f87171" stroke-width="2" filter="url(#glowPink)"/>
  <polygon points="360,410 375,375 390,410" fill="#ef4444" stroke="#f87171" stroke-width="2" filter="url(#glowPink)"/>

  <!-- Portal Ring / Goal on right -->
  <circle cx="410" cy="220" r="44" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="16 8" filter="url(#glowYellow)"/>
  <circle cx="410" cy="220" r="28" fill="#15803d" opacity="0.4" filter="url(#glowYellow)"/>

  <!-- HERO PIXEL RUNNER CHARACTER (Dynamic Jump / Dash Pose) -->
  <g transform="translate(180, 150)">
    <!-- Aura / Shadow -->
    <rect x="-10" y="-10" width="130" height="150" rx="20" fill="#38bdf8" opacity="0.25" filter="url(#glowCyan)"/>

    <!-- Hero Body Core (Neon Cyan & Electric Blue) -->
    <rect x="20" y="10" width="70" height="85" rx="14" fill="#06b6d4" stroke="#67e8f9" stroke-width="4" filter="url(#glowCyan)"/>

    <!-- Headband / Ninja Ribbon flying back -->
    <path d="M 20 25 L -45 10 L -30 28 L -55 35 L 20 38 Z" fill="#ec4899" filter="url(#glowPink)"/>

    <!-- Cyber Visor Eyes (Glowing Yellow/White) -->
    <rect x="45" y="28" width="40" height="16" rx="6" fill="#fef08a" stroke="#ffffff" stroke-width="2" filter="url(#glowYellow)"/>
    <circle cx="72" cy="36" r="3" fill="#ffffff" />

    <!-- Jet / Speed Particle from boots -->
    <ellipse cx="25" cy="115" rx="12" ry="6" fill="#ec4899" filter="url(#glowPink)"/>
    <ellipse cx="75" cy="120" rx="14" ry="7" fill="#38bdf8" filter="url(#glowCyan)"/>

    <!-- Running Legs -->
    <rect x="22" y="90" width="20" height="26" rx="6" fill="#0284c7" />
    <rect x="58" y="90" width="22" height="30" rx="6" fill="#0284c7" />
  </g>

  <!-- Speed Lightning Bolt Accent -->
  <path d="M 270 55 L 230 110 L 255 110 L 220 170 L 290 95 L 260 95 Z" fill="#facc15" stroke="#ffffff" stroke-width="2" filter="url(#glowYellow)"/>

  <!-- Subtle High-tech Corner Accents -->
  <path d="M 40 90 L 40 40 L 90 40" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <path d="M 472 90 L 472 40 L 422 40" fill="none" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>
  <path d="M 40 422 L 40 472 L 90 472" fill="none" stroke="#a855f7" stroke-width="5" stroke-linecap="round"/>
  <path d="M 472 422 L 472 472 L 422 472" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
</svg>
